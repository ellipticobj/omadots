# Extra autostart processes
# exec-once = uwsm-app -- my-service
#
exec-once = uwsm-app -- vicinae server
exec-once = uwsm-app -- snappy-switcher --daemon

exec-once = uwsm-app -- hypridle
exec-once = uwsm-app -- mako
exec-once = ! toggle-enabled waybar-off && uwsm-app -- launch-waybar
exec-once = uwsm-app -- fcitx5 --disable notificationitem
exec-once = uwsm-app -- swaybg -i ~/.config/themes/current/background -m fill
exec-once = uwsm-app -- swayosd-server
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = first-run
exec-once = powerprofiles-init
exec-once = uwsm-app -- hyprland-monitor-watch

# Slow app launch fix -- set systemd vars
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all

exec-once = hyprpm reload
