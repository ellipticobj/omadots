# Menus
bindd = SUPER, SPACE, Launch apps, exec, launch-walker
bindd = SUPER CTRL, E, Emoji picker, exec, launch-walker -m symbols
bindd = SUPER CTRL, C, Capture menu, exec, menu capture
bindd = SUPER CTRL, O, Toggle menu, exec, menu toggle
bindd = SUPER CTRL, H, Hardware menu, exec, menu hardware
bindd = SUPER, ESCAPE, System menu, exec, menu system
bindld = , XF86PowerOff, Power menu, exec, menu system
bindd = SUPER, K, Show key bindings, exec, menu-keybindings
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, toggle-waybar
bindd = SUPER CTRL, SPACE, Theme background menu, exec, menu background
bindd = SUPER SHIFT CTRL, SPACE, Theme menu, exec, menu theme
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprland-active-window-transparency-toggle
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, hyprland-window-gaps-toggle
bindd = SUPER CTRL, BACKSPACE, Toggle single-window square aspect, exec, hyprland-window-single-square-aspect-toggle

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, toggle-notification-silencing
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggles
bindd = SUPER CTRL, I, Toggle locking on idle, exec, toggle-idle
bindd = SUPER CTRL, N, Toggle nightlight, exec, toggle-nightlight
bindd = SUPER CTRL, Delete, Toggle laptop display, exec, hyprland-monitor-internal toggle
bindd = SUPER CTRL ALT, Delete, Toggle laptop display mirroring, exec, hyprland-monitor-internal-mirror toggle
bindl = , switch:on:Lid Switch, exec, hw-external-monitors && hyprland-monitor-internal off
bindl = , switch:off:Lid Switch, exec, hyprland-monitor-internal on

# Captures
bindd = , PRINT, Screenshot, exec, capture-screenshot smart
bindd = ALT SHIFT, 3, Full screen screenshot, exec, capture-screenshot fullscreen
bindd = ALT SHIFT, 4, smart screenshot, exec, capture-screenshot smart
bindd = ALT SHIFT, 5, window screenshot, exec, capture-screenshot window
bindd = ALT, PRINT, Screenrecording, exec, menu screenrecord
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a
bindd = SUPER CTRL, PRINT, Extract text (OCR) from screenshot, exec, capture-text-extraction

# File sharing
bindd = SUPER CTRL, S, Share, exec, menu share

# Waybar-less information
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send -u low "    $(date +"%A %H:%M  ·  %d %B %Y  ·  Week %V")"
bindd = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send -u low "$(battery-status)"

# Control panels
bindd = SUPER CTRL, A, Audio controls, exec, launch-audio
bindd = SUPER CTRL, B, Bluetooth controls, exec, launch-bluetooth
bindd = SUPER CTRL, W, Wifi controls, exec, launch-wifi
bindd = SUPER CTRL, T, Activity, exec, launch-tui btop

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Lock system
bindd = SUPER CTRL, L, Lock system, exec, system-lock
